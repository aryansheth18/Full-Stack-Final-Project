services:
  - type: web
    name: store-rating-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client && cd server && npx prisma generate && npx prisma db push && npm run seed && npx tsc
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: storerate-db
          property: connectionString

databases:
  - name: storerate-db
    plan: free
    databaseName: storerate
    user: storerate_user
